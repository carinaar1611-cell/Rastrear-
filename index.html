<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rastreabilidade do Lote - EcoBite</title>
    <!-- Inclui Tailwind CSS para estilização rápida e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        /* Paleta de Cores EcoBite */
        :root {
            --color-primary: #FCE400; /* Amarelo Vibrante */
            --color-secondary: #000080; /* Azul Escuro (Navy) */
            --color-text: #1F2937; /* Cinza Escuro */
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
        }
        .bg-primary { background-color: var(--color-primary); }
        .text-secondary { color: var(--color-secondary); }
        .border-secondary { border-color: var(--color-secondary); }
        .ring-secondary:focus {
             --tw-ring-color: var(--color-secondary);
        }
        .shadow-eco {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 sm:p-8">

    <!-- Container Principal -->
    <div class="w-full max-w-4xl bg-white rounded-xl shadow-eco overflow-hidden">
        
        <!-- Header da Marca -->
        <header class="bg-primary p-6 sm:p-8 text-center rounded-t-xl">
            <h1 class="text-3xl sm:text-4xl font-extrabold text-secondary tracking-tight">
                Eco<span class="font-normal">Bite</span>
            </h1>
            <p class="text-secondary mt-1 text-lg sm:text-xl font-medium">Transparência Total: Rastreie o seu Lote</p>
        </header>

        <!-- Seção de Pesquisa -->
        <section class="p-6 sm:p-8 border-b border-gray-100">
            <div class="flex flex-col sm:flex-row gap-4">
                <input type="text" id="loteInput" placeholder="Introduza o Nº do Lote (ex: EB2025-07B, EB2025-10C, EB2025-12A)" 
                       class="flex-grow p-3 border-2 border-secondary rounded-lg focus:outline-none focus:ring-2 ring-secondary transition duration-150 text-gray-700">
                <button id="rastrearBtn" onclick="rastrearLote()" 
                        class="bg-secondary text-white font-bold py-3 px-6 rounded-lg hover:bg-opacity-90 transition duration-150 shadow-md">
                    RASTREAR LOTE
                </button>
            </div>
            <p id="errorMsg" class="text-red-500 mt-2 font-medium hidden">Por favor, insira um número de lote válido.</p>
        </section>

        <!-- Seção de Resultados -->
        <section id="resultsSection" class="p-6 sm:p-8">
            <h2 id="resultsTitle" class="text-2xl font-bold text-gray-800 mb-6 hidden"></h2>
            
            <!-- Indicador de Carregamento -->
            <div id="loadingIndicator" class="text-center py-10 hidden">
                <div class="animate-spin inline-block w-8 h-8 border-4 rounded-full border-secondary border-t-transparent"></div>
                <p class="mt-3 text-secondary font-medium">A carregar o relatório de impacto...</p>
